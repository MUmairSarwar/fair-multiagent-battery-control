name: Regenerate extension figures

on:
  push:
    branches: [docs-extension-rewrite]
    paths: ['.github/workflows/regenerate-figures.yml']

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: LP variants and MILP on the 51 test days
        run: python scripts/compare_lp_variants.py --include-milp
      - name: Hard-limit figures from stored results
        run: python scripts/plot_hard_limit.py
      - name: Commit regenerated outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/distributed/lp_variants results/distributed/hard_limit/figures
          git diff --cached --quiet && exit 0
          git commit -m 'Regenerate LP-variant results and extension figures with updated labels'
          git push
